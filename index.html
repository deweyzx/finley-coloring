<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- "user-scalable=no" stops Safari's own pinch-zoom; the app will do its own zooming on the picture. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Finley's Coloring Book</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- type="module" lets our JavaScript files import from each other. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- SCREEN 1: the library (categories, sub-categories and pages all use this screen) -->
  <section id="gallery-screen" class="screen">
    <header class="topbar">
      <a id="library-back" class="icon-button" href="#/" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="titles">
        <p id="library-crumb" class="crumb" hidden></p>
        <h1 id="library-title">Finley's Coloring Book</h1>
      </div>
    </header>
    <p id="library-notice" class="notice" hidden></p>
    <main id="gallery-grid" class="gallery-grid"></main>
  </section>

  <!-- SCREEN 2: coloring one page (hidden until a page is picked) -->
  <section id="coloring-screen" class="screen" hidden>
    <header class="topbar">
      <a id="back-button" class="icon-button" href="#/" aria-label="Back to pages">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1 id="page-title"></h1>
    </header>

    <!-- The picture and the tool panel. The panel sits below the picture when the iPad
         is upright, and to the right of it when it's sideways. -->
    <div class="workspace">
      <!-- The area the picture lives in. Later, pinch-zoom and pan happen here. -->
      <div id="canvas-area" class="canvas-area">
        <!-- The "paper" holds the stacked layers. The line art canvas sits ON TOP of the color canvas,
             so coloring can never cover the black lines. -->
        <div id="paper" class="paper" hidden>
          <canvas id="color-canvas"></canvas>
          <canvas id="line-canvas"></canvas>
        </div>
        <p id="canvas-message" class="canvas-message"></p>
      </div>

      <aside class="tool-panel">
        <!-- Tools. Step 4 adds brushes and the eraser; step 5 adds undo and redo. -->
        <div class="tools">
          <button class="tool-button" type="button" data-tool="fill" aria-label="Fill">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M5 11 L11 5 L18 12 L12 18 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M5 11 L18 12" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M20 15 C 21.5 17 21.5 18.5 20 19.2 C 18.5 18.5 18.5 17 20 15 Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <!-- Color swatches (filled in by palette.js) -->
        <div id="palette" class="palette"></div>
      </aside>
    </div>
  </section>

</body>
</html>
