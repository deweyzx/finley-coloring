<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- "user-scalable=no" stops Safari's own pinch-zoom; the app will do its own zooming on the picture. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Finley's Coloring Book</title>
  <link rel="stylesheet" href="css/styles.css?v=202610182246">
  <!-- type="module" lets our JavaScript files import from each other. -->
  <script type="module" src="js/app.js?v=202610182246"></script>
</head>
<body>

  <!-- SCREEN 1: the library (categories, sub-categories and pages all use this screen) -->
  <section id="gallery-screen" class="screen">
    <header class="topbar">
      <a id="library-back" class="icon-button" href="#/" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="titles">
        <p id="library-crumb" class="crumb" hidden></p>
        <h1 id="library-title">Finley's Coloring Book</h1>
      </div>
    </header>
    <p id="library-notice" class="notice" hidden></p>
    <main id="gallery-grid" class="gallery-grid"></main>
  </section>

  <!-- SCREEN 2: coloring one page (hidden until a page is picked) -->
  <section id="coloring-screen" class="screen" hidden>
    <header class="topbar">
      <a id="back-button" class="icon-button" href="#/" aria-label="Back to pages">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1 id="page-title"></h1>
      <!-- Undo ("back") and redo ("forward"). -->
      <div class="history-buttons">
        <button id="undo-button" class="icon-button" type="button" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <path d="M9 14 L4 9 L9 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 9 H14 a6 6 0 0 1 0 12 H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="redo-button" class="icon-button" type="button" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <path d="M15 14 L20 9 L15 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 9 H10 a6 6 0 0 0 0 12 H14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- The picture and the tool panel. The panel sits below the picture when the iPad
         is upright, and to the right of it when it's sideways. -->
    <div class="workspace">
      <!-- The area the picture lives in. Later, pinch-zoom and pan happen here. -->
      <div id="canvas-area" class="canvas-area">
        <!-- The "paper" holds the stacked layers. The line art canvas sits ON TOP of the color canvas,
             so coloring can never cover the black lines. -->
        <div id="paper" class="paper" hidden>
          <canvas id="color-canvas"></canvas>
          <!-- The brush stroke being drawn right now. It joins the color layer when the Pencil lifts. -->
          <canvas id="stroke-canvas"></canvas>
          <canvas id="line-canvas"></canvas>
        </div>
        <p id="canvas-message" class="canvas-message"></p>
        <!-- Flashes "Undo" / "Redo" after a two- or three-finger tap. -->
        <div id="toast" class="toast" aria-live="polite"></div>
        <!-- Temporary touch debug log. Show it by opening the app with ?debug at the end of the
             link, or by tapping the page title 5 times; hide it with its "Hide log" button. -->
        <div id="touch-debug" class="touch-debug" hidden>
          <div class="touch-debug-head">
            <span>Touch log (newest at top)</span>
            <button id="touch-debug-hide" class="touch-debug-hide" type="button">Hide log</button>
          </div>
          <pre id="touch-debug-lines"></pre>
        </div>
      </div>

      <aside class="tool-panel">
        <div class="panel-top">
          <!-- Tools: fill, then one button per brush (added by editor.js from brushes.js).
               Step 5 adds undo and redo. -->
          <div class="tool-column">
            <div id="tools" class="tools">
              <button class="tool-button" type="button" data-tool="fill" aria-label="Fill">
                <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                  <path d="M5 11 L11 5 L18 12 L12 18 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <path d="M5 11 L18 12" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M20 15 C 21.5 17 21.5 18.5 20 19.2 C 18.5 18.5 18.5 17 20 15 Z" fill="currentColor"/>
                </svg>
              </button>
            </div>

            <!-- Line-lock: when on, brush strokes stay inside the area where they start. -->
            <button id="line-lock" class="toggle-switch" type="button" role="switch" aria-checked="true">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path class="shackle-closed" d="M8.5 10.5 V8 a3.5 3.5 0 0 1 7 0 V10.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path class="shackle-open" d="M8.5 10.5 V7 a3.5 3.5 0 0 1 6.8 -1.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="15.5" r="1.5" fill="currentColor"/>
              </svg>
              <span class="toggle-label">Stay inside lines</span>
              <span class="toggle-state">On</span>
            </button>

            <!-- Build up color: when on, a new stroke over color deepens it (layering and
                 shading); when off, going over the same color again keeps it even. -->
            <button id="build-up" class="toggle-switch" type="button" role="switch" aria-checked="true">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <circle cx="9.5" cy="12" r="5.5" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="14.5" cy="12" r="5.5" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <span class="toggle-label">Build up color</span>
              <span class="toggle-state">On</span>
            </button>
          </div>

          <!-- Brush controls: a live preview and the size and opacity sliders. -->
          <div id="brush-controls" class="brush-controls">
            <canvas id="brush-preview" class="brush-preview" aria-label="Brush preview"></canvas>
            <div id="size-slider"></div>
            <div id="opacity-slider"></div>
          </div>
        </div>
        <!-- Color swatches (filled in by palette.js) -->
        <div id="palette" class="palette"></div>
      </aside>
    </div>
  </section>

</body>
</html>
